import java.text.SimpleDateFormat

buildscript {
    repositories {
        maven { url = "https://plugins.gradle.org/m2/" }
        maven { url = 'https://maven.minecraftforge.net' }
        maven { url = 'https://maven.parchmentmc.org' }
        maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
        maven {
            // 阿里云镜像，方便国内开发
            url = uri("https://maven.aliyun.com/repository/public/")
        }
        mavenCentral()
        gradlePluginPortal()
    }
    dependencies {
//        classpath 'net.neoforged.gradle.userdev:net.neoforged.gradle.userdev.gradle.plugin:7.0.145'
//        classpath 'net.neoforged.gradle.mixin:net.neoforged.gradle.mixin.gradle.plugin:7.0.145'
//        classpath 'org.parchmentmc:librarian:1.+'
        classpath group: 'org.spongepowered', name: 'mixingradle', version: '0.7-SNAPSHOT'
    }
}

plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.neoforged.gradle.userdev' version '7.0.170'
    id 'net.neoforged.gradle.mixin' version '7.0.170'
}

//apply plugin: 'net.neoforged.gradle.userdev'
//apply plugin: 'net.neoforged.gradle.mixin'
//apply plugin: 'org.parchmentmc.librarian.forgegradle'
//apply plugin: 'eclipse'
//apply plugin: 'org.spongepowered.mixin'
//apply plugin: 'java'

tasks.named('wrapper', Wrapper).configure {
    // Define wrapper values here so as to not have to always do so when updating gradlew.properties.
    // Switching this to Wrapper.DistributionType.ALL will download the full gradle sources that comes with
    // documentation attached on cursor hover of gradle classes and methods. However, this comes with increased
    // file size for Gradle. If you do switch this to ALL, run the Gradle wrapper task twice afterwards.
    // (Verify by checking gradle/wrapper/gradle-wrapper.properties to see if distributionUrl now points to `-all`)
    distributionType = Wrapper.DistributionType.BIN
}

version = "1.1.4-neoforge"
// 版本号，正式发布需要修改这一行
// 设置日期格式，用于填充快照版版本号
//SimpleDateFormat FORMAT = new SimpleDateFormat("MMdd-HHmmss")
//FORMAT.setTimeZone(TimeZone.getTimeZone("UTC"))
//version = FORMAT.format(new Date())
group = "com.tacz"

base {
    archivesBaseName = "tacz-1.21.1"
}

// Mojang ships Java 21 to end users starting in 1.20.5, so mods should target Java 21.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

minecraft.accessTransformers.file rootProject.file('src/main/resources/META-INF/accesstransformer.cfg')

mixin {
//    add sourceSets.main, "tacz.refmap.json"
    config "tacz.mixins.json"
}

minecraft {
    // 使用 parchment 来反混淆变量名
//    mappings channel: 'parchment', version: '2024.11.17-1.21.1'
    // 使用 access transformer 来修改原版的一些方法访问修饰符
//    accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')
}

// 运行参数
runs {
    // applies to all the run configs below
    configureEach {
        // Recommended logging data for a userdev environment
        // The markers can be added/remove as needed separated by commas.
        // "SCAN": For mods scan.
        // "REGISTRIES": For firing of registry events.
        // "REGISTRYDUMP": For getting the contents of all registries.
        systemProperty 'forge.logging.markers', 'SCAN,REGISTRIES,REGISTRYDUMP'

        // Recommended logging level for the console
        // You can set various levels here.
        // Please read: https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
        systemProperty 'forge.logging.console.level', 'debug'

        // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
        systemProperty 'forge.enabledGameTestNamespaces', 'tacz'

        dependencies {
//            runtime project.configurations.libraries
            // Apache Commons Math 库，用于进行一些插值运算
            runtime 'org.apache.commons:commons-math3:3.6.1'
            // LuaJ 库，将 lua 脚本语言引入用于控制枪械的逻辑和动画状态机
            runtime 'com.github.FiguraMC.luaj:luaj-core:3.0.8-figura'
            runtime 'com.github.FiguraMC.luaj:luaj-jse:3.0.8-figura'
            runtime 'org.apache.bcel:bcel:6.6.1'
        }

        modSource project.sourceSets.main
//        modSource {
//            tacz {
//                source sourceSets.main
//            }
//        }
    }

    client {
        // 使用 JetBrainsRuntime 时需要的参数，否则无法热重载
        // 如果你使用别的 JDK，那么可以删除这一行
//        jvmArgs "-XX:+AllowEnhancedClassRedefinition"
        // 每个启动单独区分文件夹
        workingDirectory project.file('runs/client_a')
        systemProperty 'mixin.env.remapRefMap', 'true'
        systemProperty 'mixin.env.refMapRemappingFile', "${buildDir}/createSrgToMcp/output.srg"
        dependencies {
            runtime("curse.maven:shoulder-surfing-reloaded-243190:6043496")
        }
//        mods {
//            tacz {
//                source sourceSets.main
//            }
//        }
    }

    client {
        workingDirectory project.file('runs/client_b')
        systemProperty 'mixin.env.remapRefMap', 'true'
        systemProperty 'mixin.env.refMapRemappingFile', "${buildDir}/createSrgToMcp/output.srg"
        // 设定用户名
        programArguments.addAll '--username', 'mayday_memory'
        dependencies {
            runtime("curse.maven:shoulder-surfing-reloaded-243190:6043496")
        }
//        mods {
//            tacz {
//                source sourceSets.main
//            }
//        }
    }

    server {
        workingDirectory project.file('runs/server')
        programArgument '--nogui'
        systemProperty 'mixin.env.disableRefMap', 'true'
        systemProperty 'mixin.env.remapRefMap', 'true'
        systemProperty 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
//        mods {
//            tacz {
//                source sourceSets.main
//            }
//        }
    }

    data {
        workingDirectory project.file('runs/data')
        systemProperty 'mixin.env.disableRefMap', 'true'
        programArguments.addAll '--mod', 'tacz', '--all', '--output', file('src/generated/resources/').getAbsolutePath()
//        mods {
//            tacz {
//                source sourceSets.main
//            }
//        }
    }
}

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    maven {
        // 阿里云镜像，方便国内开发
        url = uri("https://maven.aliyun.com/repository/public/")
        content {
            includeGroup 'org.apache.commons'
        }
    }
    maven {
        // location of the maven that hosts JEI files since January 2023
        // Patchouli
        name = "Jared's maven"
        url = "https://maven.blamejared.com/"
    }
    maven {
        // location of a maven mirror for JEI files, as a fallback
        name = "Mod Maven"
        url = "https://modmaven.k-4u.nl"
    }
    maven {
        url "https://cursemaven.com"
        content {
            includeGroup "curse.maven"
        }
    }
    maven { url "https://maven.shedaniel.me/" } // cloth config api
    maven { url "https://dvs1.progwml6.com/files/maven/" }
    maven { url "https://modmaven.dev" }
    maven {
        name = 'tterrag maven'
        url = 'https://maven.tterrag.com/'
    }
    maven {
        url 'https://jitpack.io'
    }
    maven {
        name "KosmX's maven"
        url 'https://maven.kosmx.dev/'
    }
    mavenCentral() // MixinExtras is there
    mavenLocal()
    flatDir {
        dir 'libs'
    }
}

//configurations {
//    libraries
//    // This will make sure that all dependencies that you add to the libraries configuration will also be added to the implementation configuration
//    // This way, you only need one dependency declaration for both runtime and compile dependencies
//    implementation.extendsFrom libraries
//}

//// Sets up a dependency configuration called 'localRuntime'.
//// This configuration should be used instead of 'runtimeOnly' to declare
//// a dependency that will be present for runtime testing but that is
//// "optional", meaning it will not be pulled by dependents of this mod.
//configurations {
//    runtimeClasspath.extendsFrom localRuntime
//}

dependencies {
    implementation "net.neoforged:neoforge:${neo_version}"

    // Apache Commons Math 库，用于进行一些插值运算
    implementation(jarJar('org.apache.commons:commons-math3:3.6.1')) {
        jarJar.ranged(it, "[3.6.1,)")
    }

    // LuaJ 库，将 lua 脚本语言引入用于控制枪械的逻辑和动画状态机
    implementation(jarJar('com.github.FiguraMC.luaj:luaj-core:3.0.8-figura')) {
        exclude group: 'org.apache.commons', module: 'commons-lang3'
        jarJar.ranged(it, "[3.0.8,)")
    }
    implementation(jarJar('com.github.FiguraMC.luaj:luaj-jse:3.0.8-figura')) {
        exclude group: 'org.apache.commons', module: 'commons-lang3'
        jarJar.ranged(it, "[3.0.8,)")
    }
    implementation(jarJar('org.apache.bcel:bcel:6.6.1')) {
        exclude group: 'org.apache.commons', module: 'commons-lang3'
        jarJar.ranged(it, "[6.6.1,)")
    }

    // compile against the JEI API but do not include it at runtime
    compileOnly("mezz.jei:jei-1.21.1-common-api:${jei_version}")
    compileOnly("mezz.jei:jei-1.21.1-neoforge-api:${jei_version}")
    // at runtime, use the full JEI jar for Forge
//    localRuntime("mezz.jei:jei-1.21.1-neoforge:19.21.0.247")
    // 性能分析工具模组
//    runtimeOnly("curse.maven:spark-361579:4738952")
    // 假人，测试近战伤害
    runtimeOnly("curse.maven:selene-499980:5983849")
    runtimeOnly("curse.maven:mmmmmmmmmmmm-225738:5779508")
    // 手柄按键支持
    implementation("curse.maven:framework-549225:5911998")
//    compileOnly("curse.maven:controllable-317269:4598985")
    // 测试，检验NBT标签
    runtimeOnly("curse.maven:nbtedit-reborn-678133:5660976")

    // 越肩视角，用来兼容第三人称准星
    compileOnly("curse.maven:shoulder-surfing-reloaded-243190:6043496")

    implementation("me.shedaniel.cloth:cloth-config-neoforge:${cloth_config_neoforge}")

    compileOnly("curse.maven:embeddium-908741:${embeddedt_id}")
    // 同时兼容两个版本
//    compileOnly('libs:oculus_legacy:mc1.20.1-1.6.13')
//    compileOnly('libs:oculus:mc1.20.1-1.7.0')
    compileOnly('curse.maven:irisshaders-455508:5957827')

    runtimeOnly("curse.maven:carry-on-274259:${carry_on_id}")

    implementation("dev.kosmx.player-anim:player-animation-lib-forge:${player_animation_lib}")

    // 引入 MixinExtras 以解决一些棘手的 Mixin 冲突问题（比如 @Redirect 不能嵌套）
    // 如果未来有迁移到 Fabric / NeoForge 的计划，请注意这两个框架都已自带 MixinExtras，无需自行打包。
//    compileOnly(annotationProcessor("io.github.llamalad7:mixinextras-common:0.3.6"))
//    implementation(jarJar("io.github.llamalad7:mixinextras-forge:0.3.6")) {
//        jarJar.ranged(it, "[0.3.6,)")
//    }
//    annotationProcessor 'net.fabricmc:sponge-mixin:0.14.0+mixin.0.8.6:processor'
}

jar {
    // 打包时，给 manifest 文件写入一些有用信息
    // 这些信息会被游戏调用，从而显示成模组的名称和版本信息
    manifest {
        attributes([
                "Implementation-Title"  : project.name,
                "Implementation-Version": project.version
        ])
    }
}

java {
    // 编译源码文件，方便发布 maven
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// IDEA no longer automatically downloads sources/javadoc jars for dependencies, so we need to explicitly enable the behavior.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
